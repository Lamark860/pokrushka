<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}База Маркетинг{% endblock %}</title>
<style>
/* Экран одновременно рабочий пульт и доказательство, которое показывают клиентам.
   Отсюда моноширинные числа, плотная сетка — и настоящая палитра, а не обесцвечивание:
   сущности, которые реально разные (площадки, деньги, провал), обязаны различаться.

   Все значения проверены, а не подобраны на глаз:
     категориальные (площадки) #2a78d6 / #4a3aa7 / #e87ba4 — разделимость при
       дальтонизме ΔE 13.0 при пороге 8, прогнано валидатором палитр;
     статусные проверены по WCAG (они никогда не стоят рядом и всегда со значком
       и подписью, поэтому меряются контрастом, а не разделимостью):
       деньги 3.35 крупным числом и 7.54 текстом, провал 6.51 на белом и 5.85 на плашке;
     текстовые: ink 19.7, ink2 9.9, muted 5.38 на карточке и 4.98 на фоне. */
 :root {
   /* поверхности — тёплые: холодный серо-голубой давал ощущение казёнщины */
   --bg:#F7F6F3; --panel:#FFFFFF; --wash:#F2F1EC;
   --ink:#0B0B0B; --ink2:#45433E; --muted:#6E6A62;
   --line:#E1E0D9; --line2:#F2F1EC; --base-line:#C3C2B7;
   /* синий теперь служебный: ссылки, фокус, активный пункт меню */
   --accent:#1F5FA8; --accent-soft:#EAF2FD;
   /* данные */
   --data:#2a78d6; --data-soft:#CDE2FB;
   /* площадки — категориальные слоты, порядок фиксирован и не переставляется */
   --p1:#2a78d6; --p1-t:#1F5FA8;
   --p2:#4a3aa7; --p2-t:#4a3aa7;
   --p3:#e87ba4; --p3-t:#A83A66;
   /* статусные */
   --money:#0ca30c; --money-t:#006300;
   --alert:#B02B2B; --alert-soft:#FDF0EF; --alert-ring:#F3D3D1;
   --danger:#B02B2B; --danger-soft:#FDF0EF;
   --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
   --radius:12px;
 }
 * { box-sizing:border-box; }
 html { -webkit-text-size-adjust:100%; }
 body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin:0; background:var(--bg); color:var(--ink); line-height:1.5; font-size:14.5px;
        -webkit-font-smoothing:antialiased; }
 a { color:var(--accent); text-decoration:none; }
 a:hover { text-decoration:underline; }
 h1, h2, h3 { letter-spacing:-.015em; }

 /* ---------------------------------------------------------------- шапка */
 .top { background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
 .top__inner { max-width:1200px; margin:0 auto; padding:0 20px; display:flex; align-items:center;
   gap:20px; min-height:56px; flex-wrap:wrap; }
 .top__brand { font-weight:700; letter-spacing:-.02em; font-size:15px; display:flex; align-items:center; gap:9px; }
 .top__mark { width:26px; height:26px; border-radius:7px; background:var(--ink); color:#fff;
   display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
 .top__nav { display:flex; gap:2px; margin-left:auto; align-items:center; flex-wrap:wrap; }
 .top__nav a { color:var(--ink2); font-size:14px; padding:6px 11px; border-radius:8px; font-weight:500; }
 .top__nav a:hover { background:var(--line2); text-decoration:none; }
 .top__nav a[aria-current="page"] { background:var(--accent-soft); color:var(--accent); font-weight:600; }

 .wrap { max-width:1200px; margin:0 auto; padding:22px 20px 80px; }

 /* ---------------------------------------------------------------- панели */
 .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
   padding:18px 20px; margin-bottom:16px; }
 .card h2 { margin:0 0 3px; font-size:16px; font-weight:700; }
 .hint { color:var(--muted); font-size:13px; margin:0 0 14px; max-width:76ch; }
 .muted { color:var(--muted); }
 .empty { color:var(--muted); font-size:14px; padding:6px 0 2px; }

 /* ---------------------------------------------------------------- формы */
 label { display:block; font-size:12.5px; color:var(--ink2); margin:12px 0 5px; font-weight:500; }
 input[type=text], input[type=email], input[type=password], input[type=url], input[type=file],
 textarea, select {
   width:100%; padding:9px 11px; border:1px solid var(--base-line); border-radius:9px; font:inherit;
   background:#fff; color:var(--ink); }
 input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
   outline:2px solid var(--accent); outline-offset:2px; }
 textarea { min-height:92px; resize:vertical; }
 input[readonly] { background:var(--line2); }

 button, .btn { display:inline-flex; align-items:center; gap:7px; background:var(--accent); color:#fff;
   border:1px solid var(--accent); border-radius:9px; padding:8px 15px; font:inherit; font-weight:500;
   cursor:pointer; text-decoration:none; line-height:1.35; }
 button:hover, .btn:hover { filter:brightness(1.06); text-decoration:none; }
 button.ghost, .btn.ghost { background:#fff; color:var(--ink); border-color:var(--base-line); }
 button.ghost:hover, .btn.ghost:hover { background:var(--line2); filter:none; }
 button.danger { background:#fff; color:var(--danger); border-color:var(--alert-ring); }
 button.danger:hover { background:var(--danger-soft); filter:none; }
 /* Тихое действие: удаление не должно быть самым контрастным пятном на экране,
    поэтому в покое это серый текст, а красным становится только под курсором. */
 button.quiet { background:transparent; color:var(--muted); border-color:transparent; font-weight:400; }
 button.quiet:hover { background:var(--danger-soft); color:var(--danger); border-color:var(--alert-ring);
   filter:none; }
 button.small { padding:5px 10px; font-size:13px; }
 .row { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }

 /* ---------------------------------------------------------------- таблицы */
 table { width:100%; border-collapse:collapse; font-size:13.5px; }
 th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line2); vertical-align:top; }
 th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
      border-bottom:1px solid var(--line); }
 tr:last-child td { border-bottom:0; }
 td.num, th.num { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums;
   font-size:13px; white-space:nowrap; }

 .tag { display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:99px;
   background:var(--accent-soft); color:var(--accent); font-weight:600; white-space:nowrap; }
 .tag--demo { background:var(--wash); color:var(--ink2); }
 .tag--ok { background:#E7F6EF; color:var(--money-t); }
 .tag--off { background:var(--line2); color:var(--muted); }

 .warns { background:var(--alert-soft); border:1px solid var(--alert-ring); border-radius:var(--radius);
   padding:13px 16px; margin:0 0 16px; font-size:13.5px; }
 .warns ul { margin:6px 0 0; padding-left:18px; }
 .warns li { color:var(--alert); }

 .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
 @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } }

 /* ---------------------------------------------------------------- цифры */
 .num { font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }

 .kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:16px; }
 .kpi { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; }
 .kpi__l { font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
 /* Пропорциональные цифры: на крупном кегле моноширинные выглядят разреженными */
 .kpi__v { font-size:26px; font-weight:700; margin-top:7px; line-height:1.05; letter-spacing:-.025em; }
 .kpi__s { font-size:12px; margin-top:5px; color:var(--muted); }
 .kpi--money .kpi__v { color:var(--money); }
 @media (max-width:1000px) { .kpis { grid-template-columns:repeat(3,1fr); } }
 @media (max-width:560px) { .kpis { grid-template-columns:repeat(2,1fr); } }

 /* ---------------------------------------------------------------- воронка
    Значения расходятся на пять порядков (24 400 → 1), поэтому полосы абсолютных
    величин бессмысленны: хвост вырождается в одинаковые огрызки. Показываем числа
    таблицей, а рисуем то, что сравнимо между шагами — конверсию против ориентира. */
 .fn { width:100%; border-collapse:collapse; }
 .fn th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
   font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line); text-align:left; }
 .fn td { padding:11px 10px; border-bottom:1px solid var(--line2); vertical-align:middle; }
 .fn tr:last-child td { border-bottom:0; }
 .fn__step { font-size:13.5px; font-weight:600; }
 .fn__step small { display:block; color:var(--muted); font-weight:400; font-size:11.5px; margin-top:1px; }
 .fn__count { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15px;
   font-weight:600; text-align:right; white-space:nowrap; }
 .fn__lost { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px;
   color:var(--muted); text-align:right; white-space:nowrap; }

 /* Шаги пути. Силуэт воронки убран сознательно: ступени меряются разными приборами
    и различаются на пять порядков, поэтому любая общая шкала — либо нечитаемая нить,
    либо (как было раньше) логарифм, который делает обвал в 99% похожим на «сузилось
    вдвое». Здесь каждый шаг живёт в своём масштабе, а сравнивается между шагами
    единственная сопоставимая величина — отставание от ориентира. Ориентир стоит ровно
    на середине дорожки: всё слева от засечки хуже ожидаемого. */
 .path { list-style:none; margin:0; padding:0; }
 /* Три колонки: подпись — дорожка — числа. Раньше всё шло стопкой под полосой, и
    правая половина широкого экрана пустовала. */
 .path__i { display:grid; grid-template-columns:206px minmax(160px,1fr) 300px; gap:24px;
   align-items:center; padding:14px 0; border-bottom:1px solid var(--line2); }
 .path__i:last-child { border-bottom:0; padding-bottom:2px; }
 .path__t { display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600;
   flex-wrap:wrap; }
 .path__arr { color:var(--muted); font-weight:400; }
 .path__track { position:relative; height:10px; border-radius:99px; background:var(--line2);
   max-width:620px; }
 /* Обычный шаг — рабочий синий, провал — красный. Раньше тут был серый: экран
    получался обесцвеченным, и владелец назвал палитру «серой и скудной». */
 .path__fill { height:100%; border-radius:4px; background:var(--data); min-width:3px; }
 .path__track { border-radius:4px; }
 .path__norm { position:absolute; left:50%; top:-5px; width:1px; height:20px; background:var(--base-line); }
 /* Подпись к засечке — один раз сверху, а не пять одинаковых надписей подряд.
    Над дорожкой, а не поверх заливки: на залитой полосе она не читалась. */
 .path__i:first-child .path__track { margin-top:17px; }
 .path__i:first-child .path__norm::after { content:'ориентир'; position:absolute; left:50%;
   transform:translateX(-50%); top:-16px; font-size:10.5px; color:var(--muted);
   font-weight:500; white-space:nowrap; }
 .path__facts { font-size:13px; color:var(--ink2); text-align:right;
   font-family:var(--mono); font-variant-numeric:tabular-nums; }
 .path__facts b { color:var(--ink); font-weight:600; }
 .path__verdict { color:var(--alert); font-weight:600; white-space:nowrap; }
 .path__cover { margin-top:3px; font-size:11.5px; color:var(--muted); font-weight:400; }
 .path__none { grid-column:2 / -1; font-size:12px; color:var(--muted); max-width:76ch; }
 .path__i--drop .path__fill { background:var(--alert); }
 .path__i--drop .path__facts b { color:var(--alert); }
 @media (max-width:900px) {
   .path__i { grid-template-columns:1fr; gap:9px; }
   .path__facts { text-align:left; }
   .path__none { grid-column:1; }
   .path__i:first-child .path__track { margin-top:17px; }
 }

 /* --------------------------------------------------------------- шапка-итог
    Деньги открывают экран: это то, ради чего дашборд показывают. Остальные числа —
    столбиками по центру, чтобы ряд читался рядом, а не строкой через запятую. */
 .hero { display:flex; align-items:flex-end; gap:40px; flex-wrap:wrap; }
 .hero__v { font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1; color:var(--money-t); }
 .hero__l { font-size:13px; color:var(--ink2); margin-top:7px; max-width:46ch; }
 .hero__rest { display:flex; gap:10px; flex-wrap:wrap; padding-bottom:2px; }
 .hero__rest > div { text-align:center; min-width:92px; padding:0 6px; }
 .hero__n { font-size:20px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
 .hero__c { font-size:12px; color:var(--ink2); margin-top:2px; }

 /* --------------------------------------------------------------- площадки
    Доля от целого — одна полоса с сегментами, а не бублик: при долях 77/13/10
    два меньших сегмента в кольце превращаются в неразличимые щепки. */
 .share { display:flex; gap:2px; height:22px; border-radius:4px; overflow:hidden; margin-bottom:6px; }
 .share span { display:block; }
 .share__lab { display:flex; gap:2px; font-family:var(--mono); font-size:11px;
   color:var(--ink2); margin-bottom:14px; }
 .share__lab span { text-align:center; white-space:nowrap; overflow:hidden; }
 .prow { display:grid; grid-template-columns:16px 1fr auto; gap:11px; align-items:center;
   padding:10px 0; border-bottom:1px solid var(--line2); font-size:13.5px; }
 .prow:last-child { border-bottom:0; }
 .chip { width:11px; height:11px; border-radius:3px; }
 .prow__v { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px;
   text-align:right; white-space:nowrap; }
 .prow__v em { font-style:normal; color:var(--ink2); }

 /* --------------------------------------------------------------- таймлайн
    Точки — настоящие замеры, а не дни: статистику площадок выгружают руками,
    поэтому линия идёт от выгрузки к выгрузке. */
 .tl { display:block; width:100%; height:auto; }
 .tl__ax { font-family:var(--mono); font-size:10.5px; fill:var(--muted); }
 .tl__grid { stroke:var(--line); stroke-width:1; }
 .tl__ser { fill:none; stroke:var(--data); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
 .tl__dot { fill:var(--panel); stroke:var(--data); stroke-width:2; }
 .tl__lab { font-family:var(--mono); font-size:11.5px; font-weight:600; fill:var(--ink); }
 .tl__evl { stroke:var(--line); stroke-width:1; stroke-dasharray:2 3; }
 .tl__ev { fill:var(--base-line); }
 .tl__ev--money { fill:var(--money); }
 .tl__evt { font-size:11.5px; fill:var(--ink2); }
 .tl__evt--money { fill:var(--money-t); font-weight:600; }
 .tl__evs { font-size:11px; fill:var(--muted); }
 .legend { display:flex; gap:18px; font-size:12px; color:var(--ink2); flex-wrap:wrap; }
 .legend i { display:inline-block; vertical-align:middle; margin-right:6px; }
 .legend .lg-line i { width:16px; height:2px; background:var(--data); border-radius:2px; }
 .legend .lg-money i { width:9px; height:9px; border-radius:50%; background:var(--money); }
 .headrow { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
 .thin { margin-top:12px; padding:11px 14px; background:var(--wash); border-radius:9px;
   font-size:12.5px; color:var(--ink2); }
 @media (max-width:760px) { .headrow { flex-direction:column; gap:8px; } }

 /* Мерка: заливка — доля от ориентира, риска — сам ориентир (середина дорожки). */
 .meter { display:flex; align-items:center; gap:10px; min-width:190px; }
 .meter__track { position:relative; flex:1; height:6px; background:var(--line2); border-radius:99px; }
 .meter__fill { height:100%; border-radius:99px; background:var(--data); min-width:2px; }
 .meter__mark { position:absolute; top:-4px; width:1px; height:14px; background:var(--ink2); }
 .meter__val { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px;
   min-width:52px; text-align:right; }
 .meter--low .meter__fill { background:var(--alert); }
 .meter--low .meter__val { color:var(--alert); font-weight:600; }
 .fn__flag { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--alert);
   background:var(--alert-soft); border:1px solid var(--alert-ring); border-radius:99px; padding:2px 9px;
   white-space:nowrap; }
 @media (max-width:760px) {
   .fn, .fn tbody, .fn tr, .fn td { display:block; width:100%; }
   .fn thead { display:none; }
   .fn tr { border-bottom:1px solid var(--line2); padding:8px 0; }
   .fn td { border:0; padding:3px 0; }
   .fn__count, .fn__lost { text-align:left; }
 }

 /* ---------------------------------------------------------------- полосы и топ */
 .bar { display:grid; grid-template-columns:168px 1fr 128px; align-items:center; gap:12px; margin:9px 0; }
 .bar__track { height:8px; background:var(--line2); border-radius:99px; overflow:hidden; }
 .bar__fill { height:100%; border-radius:99px; background:var(--accent); }
 .bar__val { text-align:right; font-size:13px; font-family:var(--mono); font-variant-numeric:tabular-nums; }
 @media (max-width:760px) { .bar { grid-template-columns:1fr; } .bar__val { text-align:left; } }

 .win { display:grid; grid-template-columns:26px 1fr 96px; align-items:center; gap:12px;
   padding:11px 0; border-bottom:1px solid var(--line2); }
 .win:last-child { border-bottom:0; }
 .win__rank { width:24px; height:24px; border-radius:7px; background:var(--accent-soft); color:var(--accent);
   display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px;
   font-family:var(--mono); }
 .win__t { font-weight:600; font-size:13.5px; line-height:1.35; }
 .win__s { color:var(--muted); font-size:12px; margin-top:2px; }
 .win__v { text-align:right; font-size:13px; font-family:var(--mono); font-variant-numeric:tabular-nums;
   color:var(--ink2); }

 /* ---------------------------------------------------------------- текст статьи */
 .preview { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px 22px;
   font-size:15px; line-height:1.62; }
 .preview h1 { font-size:23px; line-height:1.25; margin-top:0; }
 .preview h2 { font-size:17px; margin-top:26px; }
 .preview a { word-break:break-word; }

 details > summary { cursor:pointer; color:var(--ink2); font-size:13.5px; font-weight:500; }
 details > summary:hover { color:var(--accent); }

 /* ---------------------------------------------------------------- утилиты
    Чтобы в шаблонах не было россыпи style="margin-top:14px" — правки в одном месте. */
 .inline { margin:0; display:inline-block; }
 .mt { margin-top:14px; }
 .mt-s { margin-top:8px; }
 .mt-l { margin-top:20px; }
 .mb { margin-bottom:14px; }
 .mb-0 { margin-bottom:0; }
 /* Названия колонок и форматы в справке — моноширинным, чтобы читались как значения */
 code { font-family:var(--mono); font-size:12.5px; background:var(--wash); color:var(--ink2);
   padding:1px 5px; border-radius:5px; }
 .nowrap { white-space:nowrap; }
 .break { word-break:break-all; }
 .small { font-size:12.5px; }
 .field__hint { font-size:12px; color:var(--muted); margin-top:4px; }
 .cell-narrow { width:1%; white-space:nowrap; }
 .scroll-box { max-height:230px; overflow:auto; border:1px solid var(--line); border-radius:10px;
   padding:11px 13px; }
 .table-wrap { overflow-x:auto; }

 @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
{% if user is defined and user %}
<div class="top">
  <div class="top__inner">
    <div class="top__brand"><span class="top__mark">Б</span> База Маркетинг</div>
    <nav class="top__nav">
      {% if project is defined and project %}
        {% set path = request.url.path %}
        <a href="/projects/{{ project.id }}/dashboard"
           {% if path.endswith('/dashboard') %}aria-current="page"{% endif %}>Дашборд</a>
        <a href="/projects/{{ project.id }}/generate"
           {% if path.endswith('/generate') %}aria-current="page"{% endif %}>Сгенерировать</a>
        <a href="/projects/{{ project.id }}/articles"
           {% if path.endswith('/articles') %}aria-current="page"{% endif %}>Статьи</a>
        <a href="/projects/{{ project.id }}/metrics"
           {% if path.endswith('/metrics') %}aria-current="page"{% endif %}>Статистика</a>
        <a href="/projects/{{ project.id }}"
           {% if path == '/projects/' ~ project.id %}aria-current="page"{% endif %}>Настройки</a>
      {% endif %}
      <form method="post" action="/logout" style="margin:0 0 0 8px">
        <button class="ghost small">Выйти</button>
      </form>
    </nav>
  </div>
</div>
{% endif %}
<div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
